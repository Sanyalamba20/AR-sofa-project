<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Sofa</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1f6;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      color: #4b244a;
    }

    p {
      color: #555;
      margin: 10px 20px 20px;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      background-color: #eee;
    }

    button {
      margin: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      background: #6b3568;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #colorName {
      font-weight: bold;
      color: #4b244a;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <h1>My AR Sofa</h1>

  <p>View the sofa in 3D or place it in your space using AR.</p>

  <model-viewer
    id="sofa"
    src="sofa.glb"
    alt="3D model of a sofa"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

  <div id="colorName">Beige Sofa + Light Brown Pillow</div>

  <button onclick="changeColor()">Change Color</button>

  <script>
    const sofa = document.querySelector("#sofa");

    let colorOption = 0;

    const colors = [
      {
        name: "Beige Sofa + Light Brown Pillow",
        sofa: [0.76, 0.68, 0.55, 1],
        pillow: [0.55, 0.38, 0.24, 1]
      },
      {
        name: "Dark Blue Sofa + Cream Pillow",
        sofa: [0.04, 0.10, 0.30, 1],
        pillow: [0.90, 0.84, 0.70, 1]
      },
      {
        name: "Sage Green Sofa + Black Pillow",
        sofa: [0.42, 0.55, 0.43, 1],
        pillow: [0.03, 0.03, 0.03, 1]
      }
    ];

    sofa.addEventListener("load", () => {
      console.log("Number of materials:", sofa.model.materials.length);
    });

    function changeColor() {
      colorOption = (colorOption + 1) % colors.length;

      const option = colors[colorOption];

      const materials = sofa.model.materials;

      materials.forEach((material, index) => {

        if (index === 0) {
          material.pbrMetallicRoughness.setBaseColorFactor(option.sofa);
        } else {
          material.pbrMetallicRoughness.setBaseColorFactor(option.pillow);
        }

      });

      document.getElementById("colorName").textContent = option.name;
    }
  </script>

</body>
</html>
