<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Sofa</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1f6;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      color: #4b244a;
    }

    p {
      color: #555;
      margin: 10px 20px 20px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: #eee;
    }

    button {
      margin: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      background: #6b3568;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>My AR Sofa</h1>

  <p>View the sofa in 3D or place it in your space using AR.</p>

  <model-viewer
    src="sofa.glb"
    alt="3D model of a sofa"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

</body>
</html>
